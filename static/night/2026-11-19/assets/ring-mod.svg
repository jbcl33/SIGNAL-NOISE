<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="title desc"><title id="title">相加与相乘的理想频率分量</title><desc id="desc">400 Hz 与 1000 Hz 相加保留两条原频率；相乘得到振幅各为0.5的600 Hz和1400 Hz。非测量数据。</desc><rect width="800" height="350" fill="#111"/><g font-family="monospace" fill="white" font-size="16"><text x="35" y="34">IDEAL SINES / ANALYTICAL MAGNITUDE</text><text x="35" y="75">ADD</text><text x="35" y="210">MULTIPLY</text></g><g stroke="#777"><path d="M140 140H750M140 280H750"/><path d="M140 90V145M140 230V285"/></g><g stroke="#c6ff00" stroke-width="7"><path d="M290 140V85M515 140V85M365 280V252.5M665 280V252.5"/></g><g font-family="monospace" font-size="15" fill="white"><text x="267" y="165">400</text><text x="490" y="165">1000</text><text x="341" y="305">600</text><text x="640" y="305">1400 Hz</text><text x="277" y="75">1</text><text x="504" y="75">1</text><text x="350" y="240">0.5</text><text x="650" y="240">0.5</text><text x="35" y="334" font-size="12" fill="#aaa">Zero DC offset · Unit input amplitude · Not an FFT or hardware measurement</text></g></svg>
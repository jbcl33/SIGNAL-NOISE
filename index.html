cted){const alpha=Math.max(.06,Math.min(.95,.5-p.z*.28));ctx.fillStyle=`rgba(245,245,245,${alpha})`;ctx.font=`${Math.max(4.7,Math.min(7.5,width/105))*p.k}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.word,p.x,p.y)}}function resize(){const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);width=box.width;height=box.height;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function loop(time){frame=null;if(paused||document.hidden)return;if(time-last>=50){phase+=.028;last=time;draw()}frame=requestAnimationFrame(loop)}function sync(){if(frame!==null)cancelAnimationFrame(frame);frame=null;button.textContent=paused?'播放动画':'暂停动画';button.setAttribute('aria-pressed',String(paused));if(!paused&&!document.hidden){last=0;frame=requestAnimationFrame(loop)}}button.addEventListener('click',()=>{paused=!paused;sync()});document.addEventListener('visibilitychange',sync);reduce.addEventListener('change',()=>{paused=reduce.matches;sync()});new ResizeObserver(resize).observe(canvas);resize();sync()})();
